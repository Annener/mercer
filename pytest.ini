[pytest]
pythonpath =
    .
    rag-backend
asyncio_mode = auto
testpaths = tests/unit
markers =
    integration: tests that require running docker compose services or external processes
    docker: docker compose smoke tests
# Temporarily skipped — tests reference symbols that no longer exist in
# the production code (UpdateModeApplyVaultResult, _SESSION_TTL_SECONDS).
# Re-enable once those modules are reconciled with shared_contracts.models.
addopts =
    --ignore=tests/unit/rag_backend/test_update_mode_apply_endpoint.py
    --ignore=tests/unit/rag_backend/test_update_mode_store_complete_apply.py
    --ignore=tests/unit/rag_backend/test_update_mode_store_ttl.py